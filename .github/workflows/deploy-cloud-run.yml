name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  SERVICE_NAME: gemini-homicide-bot
  REGION: us-central1
  WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
  WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}
  PROJECT_NUMBER: ${{ secrets.GCP_PROJECT_NUMBER }}
  HAS_GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS != '' }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt pytest

      - name: Run unit tests
        run: |
          pytest tests -v
        continue-on-error: true

  deploy:
    name: Build and Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Google Cloud auth configuration
        run: |
          if [ -z "$PROJECT_ID" ]; then
            echo "::error::Missing GitHub secret GCP_PROJECT_ID."
            exit 1
          fi

          if [ -n "$WIF_PROVIDER" ] && [ -n "$WIF_SERVICE_ACCOUNT" ]; then
            echo "Using Workload Identity Federation for Google Cloud auth."
            if [ -z "$PROJECT_NUMBER" ]; then
              PROJECT_NUMBER="$(echo "$WIF_PROVIDER" | sed -n 's#^projects/\([0-9][0-9]*\)/locations/.*#\1#p')"
              echo "PROJECT_NUMBER=$PROJECT_NUMBER" >> "$GITHUB_ENV"
            fi
          elif [ "$HAS_GCP_CREDENTIALS" = "true" ]; then
            echo "Using GCP_CREDENTIALS service account JSON for Google Cloud auth."
          else
            echo "::error::Configure either WIF_PROVIDER + WIF_SERVICE_ACCOUNT, or GCP_CREDENTIALS, in GitHub Actions secrets."
            exit 1
          fi

      - name: Authenticate to Google Cloud with WIF
        if: env.WIF_PROVIDER != '' && env.WIF_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Authenticate to Google Cloud with service account JSON
        if: (env.WIF_PROVIDER == '' || env.WIF_SERVICE_ACCOUNT == '') && env.HAS_GCP_CREDENTIALS == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Ensure Gemini API key secret exists
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if gcloud secrets describe gemini-api-key --project "$PROJECT_ID" >/dev/null 2>&1; then
            echo "Secret Manager secret gemini-api-key exists."
          elif [ -n "$GEMINI_API_KEY" ]; then
            printf '%s' "$GEMINI_API_KEY" | gcloud secrets create gemini-api-key \
              --project "$PROJECT_ID" \
              --data-file=-
            echo "Created Secret Manager secret gemini-api-key from GitHub secret GEMINI_API_KEY."
          else
            echo "::error::Secret Manager secret gemini-api-key does not exist. Create it in Google Cloud, or add a GEMINI_API_KEY GitHub secret for one-time bootstrap."
            exit 1
          fi

          if [ -z "$PROJECT_NUMBER" ]; then
            echo "::error::Missing GitHub secret GCP_PROJECT_NUMBER. Add it, or use WIF_PROVIDER so the workflow can parse the project number."
            exit 1
          fi

          gcloud secrets add-iam-policy-binding gemini-api-key \
            --project "$PROJECT_ID" \
            --member="serviceAccount:${PROJECT_NUMBER}-compute@developer.gserviceaccount.com" \
            --role="roles/secretmanager.secretAccessor" \
            --quiet

      - name: Build and push Docker image
        run: |
          IMAGE_NAME="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/cloud-run-source-deploy/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          docker build -t "$IMAGE_NAME" .
          docker push "$IMAGE_NAME"
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        run: |
          REVISION_SUFFIX="$(echo "${GITHUB_SHA}" | cut -c1-12)-${GITHUB_RUN_NUMBER}"
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image "$IMAGE_NAME" \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --revision-suffix="$REVISION_SUFFIX" \
            --update-env-vars=GOOGLE_API_KEY_SECRET_REF=gemini-api-key,GCP_PROJECT_ID=${{ env.PROJECT_ID }} \
            --memory 512Mi \
            --cpu 1 \
            --timeout 300 \
            --min-instances 0 \
            --max-instances 10

      - name: Show service URL
        run: |
          gcloud run services describe ${{ env.SERVICE_NAME }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --format 'value(status.url)'
